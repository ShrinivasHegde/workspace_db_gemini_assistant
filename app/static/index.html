<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DB Gemini Assistant</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app"><aside><div class="brand">DB<span>Gemini</span><small>Schema intelligence</small></div><button id="new-chat" class="primary">+ New chat</button><div id="sessions" class="sessions"></div></aside><section class="chat"><header><div><h1>Database Assistant</h1><p id="status">Sync your database schema to begin.</p></div><button id="sync" class="secondary">↻ Sync schema</button></header><div id="schema" class="schema hidden"></div><div id="messages" class="messages"><div class="empty">Create a chat, sync your schema, then ask a database question.</div></div><form id="composer"><textarea id="question" placeholder="Ask about your database…" rows="2" required></textarea><button class="primary" type="submit">Send</button></form></section></main><script src="/app.js"></script></body></html>
